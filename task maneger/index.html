<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Taskflow – Daily Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrap">
        <header>
            <div>
                <h1>Taskflow</h1>
                <p class="date" id="today"></p>
            </div>
            <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">Dark mode</button>
        </header>

        <section class="stats" aria-label="Task summary">
            <div class="stat"><b id="sTotal">0</b><span>Total</span></div>
            <div class="stat"><b id="sPending">0</b><span>Pending</span></div>
            <div class="stat"><b id="sDone">0</b><span>Completed</span></div>
        </section>
        <div class="progress" role="progressbar" aria-label="Completion" aria-valuemin="0" aria-valuemax="100" id="bar">
            <i id="barFill"></i></div>

        <section class="panel">
            <h2 id="formTitle">Add a task</h2>
            <form class="form-grid" id="form" novalidate>
                <div class="field wide">
                    <label for="fTitle">Task</label>
                    <input id="fTitle" maxlength="80" placeholder="e.g. Finish database assignment" autocomplete="off">
                    <p class="error" id="eTitle" role="alert"></p>
                </div>
                <div class="field">
                    <label for="fCat">Category</label>
                    <select id="fCat">
                        <option>Personal</option>
                        <option>Work</option>
                        <option>Study</option>
                        <option>Health</option>
                        <option>Shopping</option>
                    </select>
                </div>
                <div class="field">
                    <label for="fPri">Priority</label>
                    <select id="fPri">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="field">
                    <label for="fDue">Due date</label>
                    <input type="date" id="fDue">
                    <p class="error" id="eDue" role="alert"></p>
                </div>
                <div class="actions">
                    <button class="btn" type="submit" id="saveBtn">Add task</button>
                    <button class="btn ghost" type="button" id="cancelBtn" hidden>Cancel edit</button>
                </div>
            </form>
        </section>

        <section class="toolbar" aria-label="Search and filters">
            <input class="search" type="search" id="q" placeholder="Search tasks" aria-label="Search tasks">
            <select id="fStatus" aria-label="Filter by status">
                <option value="all">All statuses</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>
            <select id="fCategory" aria-label="Filter by category">
                <option value="all">All categories</option>
                <option>Personal</option>
                <option>Work</option>
                <option>Study</option>
                <option>Health</option>
                <option>Shopping</option>
            </select>
            <select id="fPriority" aria-label="Filter by priority">
                <option value="all">All priorities</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
            <select id="sort" aria-label="Sort tasks">
                <option value="created">Newest first</option>
                <option value="due">Due date</option>
                <option value="priority">Priority</option>
            </select>
        </section>

        <ul id="list" aria-live="polite"></ul>
        <div class="foot">
            <span id="count"></span>
            <button class="link" id="clearDone">Clear completed</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
